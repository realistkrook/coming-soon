<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solstice Clothing Brand - Coming Soon</title>
  <!-- Font Awesome for Social Media Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #333;
    }
    .logo-container {
      margin-bottom: 20px;
    }
    .logo {
      max-width: 200px; /* Adjust this value as needed */
      height: auto;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.2em;
    }
    p {
      font-size: 1.2em;
      margin-bottom: 2em;
    }
    .social {
      margin-top: 20px;
    }
    .social a {
      text-decoration: none;
      color: #353535; /* Instagram's signature color */
      font-size: 2em;
      margin: 0 10px;
      transition: color 0.3s ease;
    }
    .social a:hover {
      color: #8e1622;
    }
    .newsletter {
      margin-top: 20px;
    }
    .newsletter input[type="email"] {
      padding: 10px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-right: 10px;
    }
    .newsletter button {
      padding: 10px 15px;
      border: none;
      background-color: #333;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    .newsletter button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <!-- Logo Section -->
  <div class="logo-container">
    <img src="logo.JPG" alt="Solstice Logo" class="logo">
    <p>Our website is under construction. Stay tuned for our launch!</p>

  </div>

  <!-- Brand Title -->

  <!-- Instagram Link -->
  <div class="social">
    <a href="https://instagram.com/solsticeclothing_" target="_blank" aria-label="Visit our Instagram">
      <i class="fab fa-instagram"></i>
    </a>
  </div>

  <!-- Optional: Newsletter Signup
